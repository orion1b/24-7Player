<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24/7 Radio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0f13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="24/7 Radio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{--bg:#0e0f13;--card:#171922;--fg:#eef0f6;--mut:#8b90a3;--acc:#ff4d6d;--line:#262938}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .wrap{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}
  #count{margin-left:auto;font-size:13px;font-weight:500;color:var(--mut);display:none}
  #count.on{display:inline}
  h1{font-size:20px;margin:4px 0;display:flex;align-items:center;gap:10px}
  .live{font-size:11px;letter-spacing:.08em;background:var(--acc);color:#fff;border-radius:99px;padding:3px 9px;display:none}
  .live.on{display:inline-block;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  input[type=text]{width:100%;background:#0e0f13;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px;font-size:15px}
  label{color:var(--mut);font-size:13px;display:flex;gap:8px;align-items:center;margin-top:10px}
  button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer}
  button.sec{background:#262938}
  button:disabled{opacity:.5}
  .row{display:flex;gap:10px;margin-top:12px}
  .row button{flex:1}
  #stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
  #stage iframe,#stage #player{position:absolute;inset:0;width:100%;height:100%}
  .title{font-weight:600;font-size:17px;margin-top:12px}
  .sub{color:var(--mut);font-size:13px}
  .bar{height:5px;background:#262938;border-radius:9px;margin-top:10px;overflow:hidden}
  .bar>div{height:100%;width:0;background:var(--acc)}
  ol{margin:8px 0 0;padding-left:20px;color:var(--mut);font-size:14px}
  ol li{margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status{color:var(--mut);font-size:13px;margin-top:8px;min-height:18px}
  .hide{display:none!important}
  #probeHost{position:fixed;left:-9999px;top:0;width:220px;height:220px}
</style>
</head>
<body>
<div class="wrap">
  <h1>24/7 Radio <span class="live" id="live">⬤ LIVE</span><span id="count"></span></h1>

  <div class="card" id="setup">
    <input type="text" id="url" placeholder="YouTube playlist link or ID (PL...)">
    <label><input type="checkbox" id="shuffle" checked> Shuffle order (same shuffle for every listener)</label>
    <div class="row"><button id="build">Start station</button></div>
    <div id="status"></div>
    <div class="sub" style="margin-top:8px">The playlist gotta be public/unlisted with embedding allowed(no auto-gen mixes). Once the station starts, all users can access the station with the same playlist link</div>
  </div>

  <div class="card hide" id="radio">
    <div id="stage"><div id="player"></div></div>
    <div class="title" id="np">—</div>
    <div class="sub" id="meta"></div>
    <div class="bar"><div id="prog"></div></div>
    <div class="row">
      <button id="tune">▶ Tune in</button>
      <button class="sec hide" id="float">⧉ Float</button>
      <button class="sec" id="change">Change playlist</button>
    </div>
    <div class="sub hide" id="adnote" style="margin-top:10px">Ad playing — the station will jump back to the live spot when it ends.</div>
    <div class="sub" style="margin-top:12px">Up next</div>
    <ol id="next"></ol>
  </div>
</div>
<div id="probeHost"><div id="probe"></div></div>
<audio id="keep" loop playsinline></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(() => {
  // ================= CONFIG =================
  // Listener counter (Supabase Realtime presence). Leave both empty to hide the counter.
  // Project Settings → API → "Project URL" and the "anon public" key (safe to put in a web page).
  const SUPABASE_URL = "https://izbunxktvgqnnaslpicv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pA8_yNl27fglPb5IXBhnAg_AVf-jJid";
  // ==========================================

  // Fixed station epoch: everyone computes the same "position in the loop" from this.
  const EPOCH = Date.UTC(2026, 0, 1) / 1000;
  const $ = id => document.getElementById(id);
  const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  let ytReady; const ytP = new Promise(r => ytReady = r);
  window.onYouTubeIframeAPIReady = () => ytReady();

  let tracks = [], total = 0, player = null, tuned = false, curIdx = -1;

  // ---------- config / hash ----------
  function parseList(v) {
    v = (v || "").trim();
    const m = v.match(/[?&]list=([\w-]+)/);
    if (m) return m[1];
    return /^[\w-]{10,}$/.test(v) ? v : "";
  }
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    return { list: p.get("list") || "", shuffle: p.get("shuffle") !== "0" };
  }
  function writeHash(list, shuffle) {
    history.replaceState(null, "", "#list=" + list + "&shuffle=" + (shuffle ? 1 : 0));
  }

  // seeded shuffle
  function seeded(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
    return () => {
      h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
      return ((h ^= h >>> 16) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, seed) {
    const a = arr.slice(), r = seeded(seed);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // probing time
  const cacheKey = l => "radio_v1_" + l;
  const loadCache = l => { try { return JSON.parse(localStorage.getItem(cacheKey(l))) || {}; } catch { return {}; } };
  const saveCache = (l, c) => { try { localStorage.setItem(cacheKey(l), JSON.stringify(c)); } catch {} };

  function waitState(p, wanted, timeout) {
    return new Promise(res => {
      let done = false;
      const fin = v => { if (done) return; done = true; clearTimeout(t); p.__cb = null; res(v); };
      const t = setTimeout(() => fin("timeout"), timeout);
      p.__cb = e => { if (e.type === "state" && wanted.includes(e.data)) fin("ok"); if (e.type === "error") fin("error"); };
    });
  }

  async function buildStation(list, shuffle) {
    const status = $("status");
    await ytP;
    const cache = loadCache(list);
    const probe = await new Promise(res => {
      const p = new YT.Player("probe", {
        height: "220", width: "220",
        playerVars: { playsinline: 1 },
        events: {
          onReady: () => res(p),
          onStateChange: e => p.__cb && p.__cb({ type: "state", data: e.data }),
          onError: e => p.__cb && p.__cb({ type: "error", data: e.data })
        }
      });
    });
    probe.mute();

    if (!cache.ids || !cache.ids.length) {
      status.textContent = "Reading playlist…";
      probe.cuePlaylist({ listType: "playlist", list });
      await waitState(probe, [5], 15000);
      let ids = null;
      for (let i = 0; i < 20 && !(ids && ids.length); i++) { ids = probe.getPlaylist(); if (!ids) await sleep(300); }
      if (!ids || !ids.length) { probe.destroy(); throw new Error("Couldn't read that playlist (is it public & embeddable?)."); }
      cache.ids = ids; cache.meta = cache.meta || {};
      saveCache(list, cache);
    }
    cache.meta = cache.meta || {};

    const todo = cache.ids.filter(id => !cache.meta[id]);
    for (let i = 0; i < todo.length; i++) {
      const id = todo[i];
      status.textContent = `Measuring songs… ${i + 1}/${todo.length} (only needed once on this device)`;
      probe.cueVideoById(id);
      const r = await waitState(probe, [5], 8000);
      let d = 0, title = "";
      if (r === "ok") {
        for (let k = 0; k < 15 && !d; k++) { d = probe.getDuration() || 0; if (!d) await sleep(200); }
        try { title = probe.getVideoData().title || ""; } catch {}
      }
      cache.meta[id] = { d: Math.floor(d), t: title || id }; // d=0 → unplayable, skipped
      saveCache(list, cache);
    }
    probe.destroy();

    let ids = cache.ids.filter(id => cache.meta[id] && cache.meta[id].d > 5);
    if (shuffle) ids = shuffled(ids, list);
    if (!ids.length) throw new Error("No playable songs found in that playlist.");
    tracks = ids.map(id => ({ id, d: cache.meta[id].d, t: cache.meta[id].t }));
    total = tracks.reduce((a, t) => a + t.d, 0);
  }

  // clock → track
  function where(offsetSec = 0) {
    let pos = (((Date.now() / 1000 + offsetSec - EPOCH) % total) + total) % total;
    for (let i = 0; i < tracks.length; i++) {
      if (pos < tracks[i].d) return { i, off: pos, left: tracks[i].d - pos };
      pos -= tracks[i].d;
    }
    return { i: 0, off: 0, left: tracks[0].d };
  }

  // player
  async function makePlayer() {
    await ytP;
    return new Promise(res => {
      const p = new YT.Player("player", {
        width: "100%", height: "100%",
        playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3 },
        events: {
          onReady: () => res(p),
          onStateChange: e => { if (e.data === 0 && tuned) setTimeout(() => tuned && syncPlay(false), 1500); },
          // a failed video: wait a few seconds, then let the clock pick whatever should be playing
          onError: () => setTimeout(() => { curIdx = -1; }, 3000)
        }
      });
    });
  }

  // ---- sync engine ----
  // Rules that stop the "reload loop" with ads and tab switches:
  //  * never reload a video that is playing, buffering, or showing an ad — only seek if it drifted
  //  * after any load, leave the player alone for LOAD_COOLDOWN ms (ads/buffering look like "not playing")
  //  * a paused video (tab switch, OS) gets playVideo(), not a reload
  const LOAD_COOLDOWN = 8000, DRIFT_LIMIT = 5;
  let lastLoad = 0, lastNudge = 0, inAd = false;

  function loadNow(s) {
    curIdx = s.i; lastLoad = Date.now();
    player.loadVideoById({ videoId: tracks[s.i].id, startSeconds: s.off });
  }
  function setAd(on) {
    if (inAd === on) return;
    inAd = on;
    $("adnote").classList.toggle("hide", !on);
  }

  function syncPlay(force) {
    if (!player || !tracks.length) return;
    const s = where(), now = Date.now(), t = tracks[s.i];
    if (force || s.i !== curIdx) { setAd(false); loadNow(s); return; }

    const st = player.getPlayerState();
    if (st === 3) return;                                   // buffering: wait
    if (st === 1) {                                         // playing
      const dur = player.getDuration() || 0;
      if (dur && Math.abs(dur - t.d) > 3) { setAd(true); return; }   // length mismatch ⇒ ad: hands off
      setAd(false);
      if (Math.abs(player.getCurrentTime() - s.off) > DRIFT_LIMIT) player.seekTo(s.off, true);
      return;
    }
    if (now - lastLoad < LOAD_COOLDOWN) return;             // just loaded; give it time
    if (st === 2) {                                         // paused (tab switch, OS) → resume, don't reload
      if (now - lastNudge > 2500) { lastNudge = now; player.playVideo(); }
      return;
    }
    if (st === 0 && s.left < 3) return;                     // finished a hair early; next tick moves on
    setAd(false); loadNow(s);                               // cued / unstarted / ended → start it
  }

  function render() {
    const s = where();
    const t = tracks[s.i];
    $("np").textContent = t.t;
    $("meta").textContent = `${fmt(s.off)} / ${fmt(t.d)} · track ${s.i + 1} of ${tracks.length} · loop ${fmt(total)}`;
    $("prog").style.width = (s.off / t.d * 100) + "%";
    const nx = [];
    for (let k = 1; k <= 5; k++) nx.push(tracks[(s.i + k) % tracks.length].t);
    $("next").innerHTML = nx.map(x => "<li></li>").join("");
    [...$("next").children].forEach((li, i) => li.textContent = nx[i]);
  }

  let tick = null, lastIdxRendered = -1;
  function startTicker() {
    clearInterval(tick);
    tick = setInterval(() => {
      const s = where();
      if (s.i !== lastIdxRendered) { lastIdxRendered = s.i; render(); updateMediaSession(); }
      $("meta").textContent = `${fmt(s.off)} / ${fmt(tracks[s.i].d)} · track ${s.i + 1} of ${tracks.length} · loop ${fmt(total)}`;
      $("prog").style.width = (s.off / tracks[s.i].d * 100) + "%";
      if (tuned) syncPlay(false);
      updateFloat(s);
    }, 1000);
  }

  // ---------- keep-alive, lock screen, wake lock ----------
  function silentWav() {
    const sr = 8000, n = sr, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true);
    v.setUint32(28, sr, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    w(36, "data"); v.setUint32(40, n, true);
    new Uint8Array(buf, 44).fill(128);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }
  const keep = $("keep");
  try { keep.src = silentWav(); keep.volume = 0.01; } catch {}

  let wakeLock = null;
  async function lockScreenOn() { try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch {} }
  function lockScreenOff() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }

  function updateMediaSession() {
    if (!("mediaSession" in navigator) || !tracks.length) return;
    const t = tracks[where().i];
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.t, artist: "24/7 Radio · LIVE", album: "Live station",
        artwork: [
          { src: "icons/icon-192.png", sizes: "192x192", type: "image/png" },
          { src: "icons/icon-512.png", sizes: "512x512", type: "image/png" }
        ]
      });
      navigator.mediaSession.playbackState = tuned ? "playing" : "paused";
    } catch {}
  }
  function setupMediaKeys() {
    if (!("mediaSession" in navigator)) return;
    const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    set("play", () => { if (!tuned) $("tune").click(); });
    set("pause", () => { if (tuned) $("tune").click(); });
    set("stop", () => { if (tuned) $("tune").click(); });
    set("nexttrack", () => { if (tuned) syncPlay(true); });   // live radio: "next" = jump to live
    set("seekbackward", null); set("seekforward", null); set("previoustrack", null);
    // Chrome 134+: auto-open the floating window when you switch away from the tab while playing
    set("enterpictureinpicture", () => { openFloat(); });
  }
  setupMediaKeys();

  // Returning to the tab / window: do NOT reload. Just re-render and let the soft sync fix drift.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (tracks.length) { lastIdxRendered = -1; }
    if (tuned) { lockScreenOn(); setTimeout(() => syncPlay(false), 600); }
  });

  // ---------- floating mini-window (Document Picture-in-Picture, desktop Chrome/Edge) ----------
  // The audio keeps playing in the main tab; this is a small always-on-top control window.
  let fl = null;
  const hasFloat = "documentPictureInPicture" in window;
  if (hasFloat) $("float").classList.remove("hide");

  async function openFloat() {
    if (!hasFloat || !tracks.length || fl) return;
    try {
      const pip = await window.documentPictureInPicture.requestWindow({ width: 340, height: 175 });
      const d = pip.document;
      d.head.innerHTML = '<meta charset="utf-8"><style>' +
        'body{margin:0;padding:14px;background:#171922;color:#eef0f6;font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;gap:8px;height:100vh}' +
        '.t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
        '.s{color:#8b90a3;font-size:12px}.bar{height:5px;background:#262938;border-radius:9px;overflow:hidden}' +
        '.bar>div{height:100%;width:0;background:#ff4d6d}' +
        'button{margin-top:auto;background:#ff4d6d;color:#fff;border:0;border-radius:10px;padding:10px;font-size:15px;font-weight:600;cursor:pointer}' +
        '</style>';
      d.body.innerHTML = '<div class="t" id="a"></div><div class="s" id="b"></div><div class="bar"><div id="c"></div></div><div class="s" id="e"></div><button id="f"></button>';
      fl = { np: d.getElementById("a"), meta: d.getElementById("b"), prog: d.getElementById("c"), cnt: d.getElementById("e"), tune: d.getElementById("f") };
      fl.tune.onclick = () => $("tune").click();
      pip.addEventListener("pagehide", () => { fl = null; });
      updateFloat(where());
    } catch {}
  }
  function updateFloat(s) {
    if (!fl) return;
    const t = tracks[s.i];
    fl.np.textContent = t.t;
    fl.meta.textContent = fmt(s.off) + " / " + fmt(t.d);
    fl.prog.style.width = (s.off / t.d * 100) + "%";
    fl.cnt.textContent = $("count").textContent;
    fl.tune.textContent = tuned ? "⏸ Tune out" : "▶ Tune in";
  }
  $("float").onclick = openFloat;

  // remember the station so the installed app opens straight into it
  function rememberStation(list, shuffle) { try { localStorage.setItem("radio_station", JSON.stringify({ list, shuffle })); } catch {} }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }

  // ---------- listener counter (Supabase Realtime presence — no tables or SQL needed) ----------
  const cid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  let sb = null, chan = null;

  function showCount() {
    if (!chan) return;
    const st = chan.presenceState();
    let n = 0;
    for (const k in st) if (st[k].some(p => p.tuned)) n++;
    $("count").textContent = "👥 " + n + " listening";
    $("count").classList.add("on");
  }
  function stopPresence() {
    try { if (chan && sb) sb.removeChannel(chan); } catch {}
    chan = null;
    $("count").classList.remove("on");
  }
  function startPresence(list) {
    if (!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) return;
    stopPresence();
    try {
      sb = sb || window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      chan = sb.channel("radio:" + list, { config: { presence: { key: cid } } });
      chan.on("presence", { event: "sync" }, showCount)
          .subscribe(status => { if (status === "SUBSCRIBED") chan.track({ tuned: !!tuned }); });
    } catch { chan = null; }
  }
  function presenceTuned() { try { chan && chan.track({ tuned: !!tuned }); } catch {} }
  addEventListener("pagehide", stopPresence);

  // ---------- UI ----------
  async function start(list, shuffle) {
    $("build").disabled = true;
    $("status").textContent = "Starting…";
    try {
      await buildStation(list, shuffle);
    } catch (e) {
      $("status").textContent = e.message;
      $("build").disabled = false;
      return;
    }
    writeHash(list, shuffle);
    rememberStation(list, shuffle);
    startPresence(list);
    $("setup").classList.add("hide");
    $("radio").classList.remove("hide");
    if (!player) player = await makePlayer();
    tuned = false; curIdx = -1; lastIdxRendered = -1; setAd(false);
    $("tune").textContent = "▶ Tune in";
    $("live").classList.remove("on");
    render(); startTicker();
    $("build").disabled = false;
  }

  $("build").onclick = () => {
    const list = parseList($("url").value);
    if (!list) { $("status").textContent = "Paste a valid YouTube playlist link or ID."; return; }
    start(list, $("shuffle").checked);
  };

  $("tune").onclick = () => {
    if (!tuned) {
      tuned = true; curIdx = -1;
      player.unMute(); player.setVolume(100);
      syncPlay(true);
      try { keep.play().catch(() => {}); } catch {}
      lockScreenOn();
      $("tune").textContent = "⏸ Tune out";
      $("live").classList.add("on");
    } else {
      tuned = false; setAd(false);
      player.pauseVideo();
      try { keep.pause(); } catch {}
      lockScreenOff();
      $("tune").textContent = "▶ Tune in";
      $("live").classList.remove("on");
    }
    presenceTuned();
    updateMediaSession();
    if (tracks.length) updateFloat(where());
  };

  $("change").onclick = () => {
    tuned = false; clearInterval(tick); stopPresence(); setAd(false);
    if (player) player.pauseVideo();
    try { keep.pause(); } catch {}
    lockScreenOff();
    $("radio").classList.add("hide");
    $("setup").classList.remove("hide");
    $("live").classList.remove("on");
  };

  // auto-load station from the url hash
  const h = readHash();
  if (h.list) {
    $("url").value = h.list;
    $("shuffle").checked = h.shuffle;
    start(h.list, h.shuffle);
  } else {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem("radio_station")); } catch {}
    if (saved && saved.list) {          // installed app launches without a hash → reopen last station
      $("url").value = saved.list;
      $("shuffle").checked = saved.shuffle !== false;
      start(saved.list, saved.shuffle !== false);
    } else {
      try { const last = localStorage.getItem("radio_last"); if (last) $("url").value = last; } catch {}
    }
  }
  $("url").addEventListener("change", () => { try { localStorage.setItem("radio_last", $("url").value); } catch {} });
})();
</script>
</body>
</html>
